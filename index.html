<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件夹图标抠图 · ICO 生成</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       background:#f7f8fa;color:#1f2937;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:22px;margin:0 0 6px;font-weight:600;letter-spacing:.3px}
  .sub{color:#6b7280;font-size:13px;margin-bottom:24px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px;margin-bottom:16px}
  .drop{border:2px dashed #d1d5db;border-radius:10px;padding:40px 20px;text-align:center;
        cursor:pointer;transition:.15s;background:#fff}
  .drop:hover,.drop.over{border-color:#2563eb;background:#eff6ff}
  .drop .big{font-size:15px;font-weight:500;margin-bottom:4px}
  .drop .small{font-size:12px;color:#6b7280}
  .row{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:#6b7280}
  select,input[type=number]{border:1px solid #d1d5db;border-radius:6px;padding:6px 8px;font-size:13px;background:#fff}
  input[type=range]{width:150px}
  .val{font-size:12px;color:#374151;font-variant-numeric:tabular-nums}
  details{margin-top:14px;border-top:1px solid #f3f4f6;padding-top:12px}
  summary{cursor:pointer;font-size:13px;color:#6b7280;user-select:none}
  .adv{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}
  .btn{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:7px 14px;font-size:13px;
       cursor:pointer;color:#374151;font-family:inherit}
  .btn:hover{background:#f3f4f6}
  .btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  .btn.primary:hover{background:#1d4ed8}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:12px;display:none}
  .bar>i{display:block;height:100%;background:#2563eb;width:0%;transition:.2s}
  .status{font-size:13px;color:#6b7280;margin-top:10px;display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px;margin-top:4px}
  .item{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;text-align:center}
  .checker{background-image:
      linear-gradient(45deg,#e9ecef 25%,transparent 25%,transparent 75%,#e9ecef 75%),
      linear-gradient(45deg,#e9ecef 25%,transparent 25%,transparent 75%,#e9ecef 75%);
    background-size:16px 16px;background-position:0 0,8px 8px;background-color:#fff;
    border-radius:6px;padding:6px;margin-bottom:10px}
  .item canvas{width:100%;height:auto;display:block}
  .nm{font-size:12px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      margin-bottom:8px;direction:rtl;text-align:left}
  .acts{display:flex;gap:6px;justify-content:center}
  .acts .btn{padding:5px 10px;font-size:12px}
  .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
  .empty{color:#9ca3af;font-size:13px;text-align:center;padding:30px}
  .note{font-size:12px;color:#9ca3af;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>文件夹图标抠图 · ICO 生成</h1>
  <div class="sub">白底图片去除背景与白边，输出统一尺寸的多规格 ICO。全程在本机浏览器完成，图片不会上传。</div>

  <div class="card">
    <div class="drop" id="drop">
      <div class="big">点击选择，或把图片拖到这里</div>
      <div class="small">支持 JPG / PNG，可一次选多张批量处理</div>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>图标画布尺寸</label>
        <select id="canvasSize">
          <option value="256" selected>256 × 256（推荐·桌面图标）</option>
          <option value="128">128 × 128</option>
        </select>
      </div>
      <div class="field">
        <label>主体占比 <span class="val" id="fitVal">88%</span></label>
        <input type="range" id="fit" min="70" max="100" value="88">
      </div>
      <div class="field">
        <label>处理精度</label>
        <select id="maxSide">
          <option value="640">标准（较快）</option>
          <option value="1024" selected>高（推荐）</option>
        </select>
      </div>
    </div>
    <details>
      <summary>高级参数（一般无需调整）</summary>
      <div class="adv">
        <div class="field">
          <label>背景容差 <span class="val" id="tolVal">10</span></label>
          <input type="range" id="tol" min="4" max="30" value="10">
        </div>
        <div class="field">
          <label>边缘收缩 <span class="val" id="shrinkVal">1.0</span></label>
          <input type="range" id="shrink" min="0" max="30" value="10">
        </div>
        <div class="field">
          <label>边缘羽化 <span class="val" id="featherVal">1.2</span></label>
          <input type="range" id="feather" min="4" max="40" value="12">
        </div>
      </div>
      <div class="note">容差越大越容易把浅色主体当成背景吃掉；若图标残缺请调小，若残留白底请调大。</div>
    </details>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="toolbar">
      <div style="font-size:14px;font-weight:500">处理结果 <span id="cnt" style="color:#6b7280;font-weight:400"></span></div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="dlAll">下载全部（ZIP）</button>
        <button class="btn" id="clear">清空</button>
      </div>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
/* ============ 算法核心（与 Python/OpenCV 版同思路，纯 JS 实现） ============ */
var INF = 1e20;

function estimateBg(d, w, h) {
  var b = Math.max(2, Math.min(w, h) / 50 | 0), i, arr = [], x, y, yb, p;
  for (i = 0; i < b; i++) {
    for (x = 0; x < w; x++) { p = (i * w + x) * 4; arr.push(d[p], d[p + 1], d[p + 2]); }
    yb = (h - 1 - i) * w;
    for (x = 0; x < w; x++) { p = (yb + x) * 4; arr.push(d[p], d[p + 1], d[p + 2]); }
  }
  for (y = 0; y < h; y++) for (i = 0; i < b; i++) {
    p = (y * w + i) * 4; arr.push(d[p], d[p + 1], d[p + 2]);
    p = (y * w + w - 1 - i) * 4; arr.push(d[p], d[p + 1], d[p + 2]);
  }
  var out = [0, 0, 0];
  for (var c = 0; c < 3; c++) {
    var ch = [];
    for (i = c; i < arr.length; i += 3) ch.push(arr[i]);
    ch.sort(function (a, b2) { return a - b2; });
    out[c] = ch[ch.length >> 1];
  }
  return out;
}

/* 与背景色比较（而非与邻居比较）—— 关键：
   否则 JPG 边缘抗锯齿渐变会被逐像素累积，一路爬进主体内部 */
function floodFillBg(d, w, h, bg, tol) {
  var n = w * h, mask = new Uint8Array(n), stack = new Int32Array(n), sp = 0;
  var tr = bg[0], tg = bg[1], tb = bg[2];
  function isBg(i) { p = i * 4; return Math.abs(d[p] - tr) <= tol && Math.abs(d[p + 1] - tg) <= tol && Math.abs(d[p + 2] - tb) <= tol; }
  function seed(i) { if (!mask[i] && isBg(i)) { mask[i] = 1; stack[sp++] = i; } }
  var p, i, ix, iy;
  for (i = 0; i < w; i++) { seed(i); seed((h - 1) * w + i); }
  for (i = 0; i < h; i++) { seed(i * w); seed(i * w + w - 1); }
  while (sp > 0) {
    i = stack[--sp]; ix = i % w; iy = (i / w) | 0;
    if (ix > 0) seed(i - 1);
    if (ix < w - 1) seed(i + 1);
    if (iy > 0) seed(i - w);
    if (iy < h - 1) seed(i + w);
  }
  return mask;
}

function fillHoles(fg, w, h) {
  var n = w * h, outside = new Uint8Array(n), stack = new Int32Array(n), sp = 0;
  function seed(i) { if (fg[i] === 0 && !outside[i]) { outside[i] = 1; stack[sp++] = i; } }
  var i, ix, iy;
  for (i = 0; i < w; i++) { seed(i); seed((h - 1) * w + i); }
  for (i = 0; i < h; i++) { seed(i * w); seed(i * w + w - 1); }
  while (sp > 0) {
    i = stack[--sp]; ix = i % w; iy = (i / w) | 0;
    if (ix > 0) seed(i - 1);
    if (ix < w - 1) seed(i + 1);
    if (iy > 0) seed(i - w);
    if (iy < h - 1) seed(i + w);
  }
  for (var k = 0; k < n; k++) if (fg[k] === 0 && !outside[k]) fg[k] = 255;
  return fg;
}

function keepComponents(fg, w, h, minRatio) {
  var n = w * h, lab = new Int32Array(n), stack = new Int32Array(n), i, j, jx, jy, id, sp, area;
  for (i = 0; i < n; i++) lab[i] = -1;
  var areas = [];
  for (i = 0; i < n; i++) {
    if (fg[i] !== 255 || lab[i] >= 0) continue;
    id = areas.length; sp = 0; area = 0; stack[sp++] = i; lab[i] = id;
    while (sp > 0) {
      j = stack[--sp]; area++; jx = j % w; jy = (j / w) | 0;
      if (jx > 0 && fg[j - 1] === 255 && lab[j - 1] < 0) { lab[j - 1] = id; stack[sp++] = j - 1; }
      if (jx < w - 1 && fg[j + 1] === 255 && lab[j + 1] < 0) { lab[j + 1] = id; stack[sp++] = j + 1; }
      if (jy > 0 && fg[j - w] === 255 && lab[j - w] < 0) { lab[j - w] = id; stack[sp++] = j - w; }
      if (jy < h - 1 && fg[j + w] === 255 && lab[j + w] < 0) { lab[j + w] = id; stack[sp++] = j + w; }
      if (jx > 0 && jy > 0 && fg[j - w - 1] === 255 && lab[j - w - 1] < 0) { lab[j - w - 1] = id; stack[sp++] = j - w - 1; }
      if (jx < w - 1 && jy > 0 && fg[j - w + 1] === 255 && lab[j - w + 1] < 0) { lab[j - w + 1] = id; stack[sp++] = j - w + 1; }
      if (jx > 0 && jy < h - 1 && fg[j + w - 1] === 255 && lab[j + w - 1] < 0) { lab[j + w - 1] = id; stack[sp++] = j + w - 1; }
      if (jx < w - 1 && jy < h - 1 && fg[j + w + 1] === 255 && lab[j + w + 1] < 0) { lab[j + w + 1] = id; stack[sp++] = j + w + 1; }
    }
    areas.push(area);
  }
  var maxA = 0;
  for (i = 0; i < areas.length; i++) if (areas[i] > maxA) maxA = areas[i];
  var thr = Math.max(maxA * minRatio, 16), out = new Uint8Array(n);
  for (i = 0; i < n; i++) if (lab[i] >= 0 && areas[lab[i]] >= thr) out[i] = 255;
  return out;
}

/* 精确欧氏距离变换（Felzenszwalb 抛物线法），返回平方距离 */
function edt1d(f, dOut, v, z, n) {
  var k = 0, q, s;
  v[0] = 0; z[0] = -INF; z[1] = INF;
  for (q = 1; q < n; q++) {
    s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = INF;
  }
  k = 0;
  for (q = 0; q < n; q++) { while (z[k + 1] < q) k++; dOut[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
}
function edt2d(isZero, w, h) {
  var n = w * h, d = new Float64Array(n), m = Math.max(w, h);
  var f = new Float64Array(m), o = new Float64Array(m), v = new Int32Array(m), z = new Float64Array(m + 1), x, y;
  for (y = 0; y < h; y++) { for (x = 0; x < w; x++) f[x] = isZero[y * w + x] ? 0 : INF; edt1d(f, o, v, z, w); for (x = 0; x < w; x++) d[y * w + x] = o[x]; }
  for (x = 0; x < w; x++) { for (y = 0; y < h; y++) f[y] = d[y * w + x]; edt1d(f, o, v, z, h); for (y = 0; y < h; y++) d[y * w + x] = o[y]; }
  return d;
}

function boxFilter(src, w, h, r, tmp, dst) {
  var norm = 1 / (2 * r + 1), x, y, acc;
  for (y = 0; y < h; y++) {
    acc = 0;
    for (x = -r; x <= r; x++) acc += src[y * w + Math.min(Math.max(x, 0), w - 1)];
    for (x = 0; x < w; x++) { tmp[y * w + x] = acc * norm; acc += src[y * w + Math.min(x + r + 1, w - 1)] - src[y * w + Math.max(x - r, 0)]; }
  }
  for (x = 0; x < w; x++) {
    acc = 0;
    for (y = -r; y <= r; y++) acc += tmp[Math.min(Math.max(y, 0), h - 1) * w + x];
    for (y = 0; y < h; y++) { dst[y * w + x] = acc * norm; acc += tmp[Math.min(y + r + 1, h - 1) * w + x] - tmp[Math.max(y - r, 0) * w + x]; }
  }
}

/* 核心区纯色向外扩散，得到每个像素的"应有前景色"——根除白边 */
function diffuseFgColor(d, w, h, coreMask, iters) {
  var n = w * h, i, c;
  var known = new Float32Array(n), fsrc = new Float32Array(n), tmp = new Float32Array(n), dst = new Float32Array(n);
  var wsum = new Float32Array(n), csum = new Float32Array(n);
  for (i = 0; i < n; i++) known[i] = coreMask[i] ? 1 : 0;
  var out = new Float32Array(n * 3);
  for (c = 0; c < 3; c++) for (i = 0; i < n; i++) out[i * 3 + c] = d[i * 4 + c];
  for (var it = 0; it < iters; it++) {
    boxFilter(known, w, h, 1, tmp, wsum);
    var changed = false;
    for (c = 0; c < 3; c++) {
      for (i = 0; i < n; i++) fsrc[i] = out[i * 3 + c] * known[i];
      boxFilter(fsrc, w, h, 1, tmp, csum);
      for (i = 0; i < n; i++) if (known[i] <= 0 && wsum[i] > 1e-6) out[i * 3 + c] = csum[i] / wsum[i];
    }
    for (i = 0; i < n; i++) if (known[i] <= 0 && wsum[i] > 1e-6) { known[i] = 1; changed = true; }
    if (!changed) break;
  }
  return out;
}

function processRGBA(d, w, h, opt) {
  var tol = opt.tol, feather = opt.feather, shrink = opt.shrink, minRatio = 0.02;
  var n = w * h, i, p;
  var bg = estimateBg(d, w, h);
  var bgMask = floodFillBg(d, w, h, bg, tol);
  var fg = new Uint8Array(n);
  for (i = 0; i < n; i++) fg[i] = bgMask[i] ? 0 : 255;
  fillHoles(fg, w, h);
  fg = keepComponents(fg, w, h, minRatio);

  var isIn = new Uint8Array(n), isOut = new Uint8Array(n);
  for (i = 0; i < n; i++) { isIn[i] = fg[i] === 0 ? 1 : 0; isOut[i] = fg[i] === 255 ? 1 : 0; }
  var dIn = edt2d(isIn, w, h), dOut = edt2d(isOut, w, h);
  var sdf = new Float32Array(n);
  for (i = 0; i < n; i++) sdf[i] = Math.sqrt(dIn[i]) - Math.sqrt(dOut[i]);

  var coreMask = new Uint8Array(n);
  for (i = 0; i < n; i++) coreMask[i] = sdf[i] > 2.5 ? 1 : 0;
  var fgCol = diffuseFgColor(d, w, h, coreMask, 12);

  var out = new Uint8ClampedArray(n * 4);
  var br = bg[0], bgg = bg[1], bb = bg[2], aGeom, aColor, den, num, dr, dg, db, obr, obg, obb, dist2, wf, a;
  for (i = 0; i < n; i++) {
    p = i * 4;
    aGeom = (sdf[i] - shrink) / feather + 0.5;
    if (aGeom < 0) aGeom = 0; else if (aGeom > 1) aGeom = 1;
    dr = fgCol[i * 3] - br; dg = fgCol[i * 3 + 1] - bgg; db = fgCol[i * 3 + 2] - bb;
    den = dr * dr + dg * dg + db * db;
    obr = d[p] - br; obg = d[p + 1] - bgg; obb = d[p + 2] - bb;
    num = obr * dr + obg * dg + obb * db;
    aColor = den > 1e-3 ? num / den : 1;
    if (aColor < 0) aColor = 0; else if (aColor > 1) aColor = 1;
    a = Math.min(aGeom, aColor);
    if (sdf[i] < 3.0) {
      dist2 = Math.sqrt(obr * obr + obg * obg + obb * obb);
      wf = (dist2 - tol * 0.5) / (tol * 1.5);
      if (wf < 0) wf = 0; else if (wf > 1) wf = 1;
      if (wf < a) a = wf;
    }
    if (a < 0.03) a = 0;
    out[p] = fgCol[i * 3]; out[p + 1] = fgCol[i * 3 + 1]; out[p + 2] = fgCol[i * 3 + 2]; out[p + 3] = (a * 255) | 0;
  }
  return out;
}

/* ============ ICO / ZIP 编码 ============ */
function buildICO(entries) {
  var n = entries.length, dirSize = 6 + 16 * n, i, total = 0;
  for (i = 0; i < n; i++) total += entries[i].png.length;
  var buf = new Uint8Array(dirSize + total), dv = new DataView(buf.buffer), off = dirSize, e, p;
  dv.setUint16(0, 0, true); dv.setUint16(2, 1, true); dv.setUint16(4, n, true);
  for (i = 0; i < n; i++) {
    e = entries[i]; p = 6 + 16 * i;
    dv.setUint8(p, e.size >= 256 ? 0 : e.size);
    dv.setUint8(p + 1, e.size >= 256 ? 0 : e.size);
    dv.setUint8(p + 2, 0); dv.setUint8(p + 3, 0);
    dv.setUint16(p + 4, 1, true); dv.setUint16(p + 6, 32, true);
    dv.setUint32(p + 8, e.png.length, true); dv.setUint32(p + 12, off, true);
    buf.set(e.png, off); off += e.png.length;
  }
  return buf;
}

var CRCT = (function () {
  var t = new Uint32Array(256), i, k, c;
  for (i = 0; i < 256; i++) { c = i; for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0; }
  return t;
})();
function crc32(b) { var c = 0xFFFFFFFF, i; for (i = 0; i < b.length; i++) c = CRCT[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function buildZip(files) {
  var enc = new TextEncoder(), parts = [], central = [], offset = 0, i;
  for (i = 0; i < files.length; i++) {
    var f = files[i], nb = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    var lh = new Uint8Array(30 + nb.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, sz, true); dv.setUint32(22, sz, true);
    dv.setUint16(26, nb.length, true); dv.setUint16(28, 0, true); lh.set(nb, 30);
    parts.push(lh, f.data);
    var ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, sz, true); cv.setUint32(24, sz, true);
    cv.setUint16(28, nb.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, offset, true);
    ch.set(nb, 46); central.push(ch);
    offset += lh.length + sz;
  }
  var cd = 0;
  for (i = 0; i < central.length; i++) cd += central[i].length;
  var eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cd, true); ev.setUint32(16, offset, true);
  var out = new Uint8Array(offset + cd + 22), p = 0, j;
  for (j = 0; j < parts.length; j++) { out.set(parts[j], p); p += parts[j].length; }
  for (j = 0; j < central.length; j++) { out.set(central[j], p); p += central[j].length; }
  out.set(eo, p);
  return out;
}

/* ============ 页面逻辑 ============ */
var $ = function (id) { return document.getElementById(id); };
var results = [];

function canvasToPNG(cv) {
  return new Promise(function (res) {
    cv.toBlob(function (b) { b.arrayBuffer().then(function (ab) { res(new Uint8Array(ab)); }); }, 'image/png');
  });
}
function loadImage(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); res(img); };
    img.onerror = function (e) { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
function download(bytes, name, mime) {
  var blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
function cropImageData(src, w, bb) {
  var bw = bb.x1 - bb.x0, bh = bb.y1 - bb.y0, out = new ImageData(bw, bh), y, s;
  for (y = 0; y < bh; y++) { s = ((y + bb.y0) * w + bb.x0) * 4; out.data.set(src.data.subarray(s, s + bw * 4), y * bw * 4); }
  return out;
}
function bboxOf(data, w, h) {
  var x0 = w, y0 = h, x1 = 0, y1 = 0, x, y, found = false;
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
    if (data[(y * w + x) * 4 + 3] > 8) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; found = true;
    }
  }
  return found ? { x0: x0, y0: y0, x1: x1 + 1, y1: y1 + 1 } : null;
}

function sizesFor(canvasSize) {
  var all = [16, 24, 32, 48, 64, 96, 128, 256], s = [];
  for (var i = 0; i < all.length; i++) if (all[i] <= canvasSize) s.push(all[i]);
  if (s[s.length - 1] !== canvasSize) s.push(canvasSize);
  return s;
}

function nextFrame() { return new Promise(function (r) { requestAnimationFrame(function () { setTimeout(r, 0); }); }); }

async function handleFiles(files) {
  files = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
  if (!files.length) { alert('请选择图片文件（JPG / PNG）'); return; }
  var canvasSize = parseInt($('canvasSize').value, 10);
  var fit = parseInt($('fit').value, 10) / 100;
  var maxSide = parseInt($('maxSide').value, 10);
  var tol = parseInt($('tol').value, 10);
  var shrink = parseInt($('shrink').value, 10) / 10;
  var feather = parseInt($('feather').value, 10) / 10;
  var sizes = sizesFor(canvasSize);

  $('resultCard').style.display = '';
  $('bar').style.display = '';
  $('status').style.display = '';
  $('status').textContent = '正在处理 0 / ' + files.length + ' …';

  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    try {
      var img = await loadImage(f);
      var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      var sc = document.createElement('canvas'); sc.width = w; sc.height = h;
      var sctx = sc.getContext('2d', { willReadFrequently: true });
      sctx.drawImage(img, 0, 0, w, h);
      var src = sctx.getImageData(0, 0, w, h);
      var out = processRGBA(src.data, w, h, { tol: tol, shrink: shrink, feather: feather });

      var bb = bboxOf(out, w, h);
      if (!bb) { console.warn('未检测到主体:', f.name); continue; }
      var bw = bb.x1 - bb.x0, bh = bb.y1 - bb.y0;
      var target = Math.round(canvasSize * fit);
      var k2 = Math.min(target / bw, target / bh);
      var nw = Math.max(1, Math.round(bw * k2)), nh = Math.max(1, Math.round(bh * k2));

      var tmpC = document.createElement('canvas'); tmpC.width = bw; tmpC.height = bh;
      tmpC.getContext('2d').putImageData(cropImageData(new ImageData(out, w, h), w, bb), 0, 0);

      var fc = document.createElement('canvas'); fc.width = fc.height = canvasSize;
      var fctx = fc.getContext('2d');
      fctx.imageSmoothingEnabled = true; fctx.imageSmoothingQuality = 'high';
      fctx.drawImage(tmpC, 0, 0, bw, bh, Math.round((canvasSize - nw) / 2), Math.round((canvasSize - nh) / 2), nw, nh);

      var entries = [];
      for (var si = 0; si < sizes.length; si++) {
        var c2 = document.createElement('canvas'); c2.width = c2.height = sizes[si];
        var c2x = c2.getContext('2d');
        c2x.imageSmoothingEnabled = true; c2x.imageSmoothingQuality = 'high';
        c2x.drawImage(fc, 0, 0, sizes[si], sizes[si]);
        entries.push({ size: sizes[si], png: await canvasToPNG(c2) });
      }
      var ico = buildICO(entries);
      var png = await canvasToPNG(fc);
      var stem = f.name.replace(/\.[^.]+$/, '');
      results.push({ name: stem, canvas: fc, ico: ico, png: png });
      addCard(results.length - 1);
    } catch (e) {
      console.error(f.name, e);
    }
    $('bar').firstElementChild.style.width = ((i + 1) / files.length * 100) + '%';
    $('status').textContent = '正在处理 ' + (i + 1) + ' / ' + files.length + ' …';
    await nextFrame();
  }
  $('status').textContent = '完成，共 ' + results.length + ' 个';
  $('cnt').textContent = '（' + results.length + '）';
  setTimeout(function () { $('bar').style.display = 'none'; }, 400);
}

function addCard(idx) {
  var r = results[idx], grid = $('grid');
  if (!grid.querySelector('.empty')) { }
  var empty = grid.querySelector('.empty'); if (empty) empty.remove();
  var item = document.createElement('div'); item.className = 'item';
  var box = document.createElement('div'); box.className = 'checker'; box.appendChild(r.canvas);
  var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = r.name + '.ico'; nm.title = r.name + '.ico';
  var acts = document.createElement('div'); acts.className = 'acts';
  var b1 = document.createElement('button'); b1.className = 'btn'; b1.textContent = 'ICO';
  b1.onclick = function () { download(r.ico, r.name + '.ico', 'image/vnd.microsoft.icon'); };
  var b2 = document.createElement('button'); b2.className = 'btn'; b2.textContent = 'PNG';
  b2.onclick = function () { download(r.png, r.name + '.png', 'image/png'); };
  acts.appendChild(b1); acts.appendChild(b2);
  item.appendChild(box); item.appendChild(nm); item.appendChild(acts);
  grid.appendChild(item);
}

$('drop').onclick = function () { $('file').click(); };
$('file').onchange = function (e) { handleFiles(e.target.files); this.value = ''; };
['dragenter', 'dragover'].forEach(function (ev) {
  $('drop').addEventListener(ev, function (e) { e.preventDefault(); $('drop').classList.add('over'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  $('drop').addEventListener(ev, function (e) { e.preventDefault(); $('drop').classList.remove('over'); });
});
$('drop').addEventListener('drop', function (e) { if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) { e.preventDefault(); });

$('fit').oninput = function () { $('fitVal').textContent = this.value + '%'; };
$('tol').oninput = function () { $('tolVal').textContent = this.value; };
$('shrink').oninput = function () { $('shrinkVal').textContent = (this.value / 10).toFixed(1); };
$('feather').oninput = function () { $('featherVal').textContent = (this.value / 10).toFixed(1); };

$('dlAll').onclick = function () {
  if (!results.length) return;
  var files = [];
  for (var i = 0; i < results.length; i++) { files.push({ name: results[i].name + '.ico', data: results[i].ico }); }
  download(buildZip(files), 'icons.zip', 'application/zip');
};
$('clear').onclick = function () {
  results = []; $('grid').innerHTML = ''; $('cnt').textContent = '';
  $('status').style.display = 'none'; $('resultCard').style.display = 'none';
};
</script>
</body>
</html>
